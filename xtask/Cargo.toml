[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false
description = "Release build automation for tunmux"

[dependencies]
tunmux-build-version.workspace = true
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user", "feature"] }
