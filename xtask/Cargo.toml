[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Release build automation for tunmux"

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user", "feature"] }
