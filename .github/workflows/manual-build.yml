name: Manual Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: main
        type: string

env:
  APP_NAME: tunmux
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build native target
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "$(cargo xtask version)"
          asset_dir="${APP_NAME}-${label}-${RELEASE_TARGET}"
          mkdir -p dist "${asset_dir}"
          cp "target/${RELEASE_TARGET}/release/${APP_NAME}" LICENSE README.md "${asset_dir}/"
          tar -czf "dist/${asset_dir}.tar.gz" "${asset_dir}"

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset_dir}.tar.gz" > "${asset_dir}.tar.gz.sha256"
          else
            shasum -a 256 "${asset_dir}.tar.gz" > "${asset_dir}.tar.gz.sha256"
          fi

      - name: Smoke-test packaged binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "$(cargo xtask version)"
          asset_dir="${APP_NAME}-${label}-${RELEASE_TARGET}"
          mkdir -p smoke
          tar -xzf "dist/${asset_dir}.tar.gz" -C smoke
          test -s "smoke/${asset_dir}/LICENSE"
          test -s "smoke/${asset_dir}/README.md"
          "smoke/${asset_dir}/${APP_NAME}" --version | grep -Fx "tunmux ${long}"
          "smoke/${asset_dir}/${APP_NAME}" --help

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
