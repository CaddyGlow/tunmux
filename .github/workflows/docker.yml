name: Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build image from (branch, tag, or SHA)
        required: true
        default: main
        type: string
      version:
        description: Docker tag/version label (for example v1.2.3-special)
        required: true
        type: string

jobs:
  docker:
    name: Publish Docker Image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
