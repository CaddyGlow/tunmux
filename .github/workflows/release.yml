name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Check tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tunmux") | .version')"
          if [ "$RELEASE_TAG" != "v${cargo_version}" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version v${cargo_version}"
            exit 1
          fi
      - name: Run repository checks
        run: cargo xtask ci --install-tools fmt clippy test audit

  build:
    name: Build release artifacts
    needs: test
    uses: ./.github/workflows/manual-build.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Publish release container
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
