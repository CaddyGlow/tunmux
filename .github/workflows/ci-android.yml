name: CI Android library

on:
  push:
  pull_request:

jobs:
  android-library:
    name: Check shared library for Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crypto: [crypto-rustcrypto, crypto-aws-lc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.3.13750724"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check shared library for app ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 check --locked --lib --no-default-features --features all-providers,${{ matrix.crypto }}
