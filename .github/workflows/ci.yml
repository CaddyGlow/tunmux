name: CI

on:
  push:
  pull_request:

# Every job runs `cargo xtask ci <step>`; the same commands run locally and in
# the git hooks under .githooks/.
jobs:
  checks:
    name: Format, Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Run checks
        run: cargo xtask ci fmt clippy test

  macos:
    name: macOS checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Run checks
        run: cargo xtask ci clippy test

  feature-sets:
    name: List feature sets
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.list.outputs.sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: List feature sets
        id: list
        run: echo "sets=$(cargo xtask ci feature-sets)" >> "$GITHUB_OUTPUT"

  provider-features:
    name: Provider features (${{ matrix.set }})
    needs: feature-sets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.feature-sets.outputs.sets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Check feature set
        env:
          FEATURE_SET: ${{ matrix.set }}
        run: cargo xtask ci features --feature-set "$FEATURE_SET"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Run cargo audit
        run: cargo xtask ci --install-tools audit

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Run rumdl
        run: cargo xtask ci --install-tools markdown

  docker:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Build and check images
        run: cargo xtask ci docker
