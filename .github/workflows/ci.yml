name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Run CI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Run repository CI script
        run: bash ./scripts/ci.sh

  macos:
    name: macOS checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Check macOS targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test desktop behavior
        run: cargo test --locked --all-features

  provider-features:
    name: Provider features (${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "proton", "airvpn,crypto-rustcrypto", "airvpn,crypto-aws-lc", "mullvad", "ivpn", "wgconf", "proxy", "proxy,wgconf"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Check feature configuration
        run: cargo clippy --locked --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: Test CLI feature availability
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}" cli::tests
      - name: Test AirVPN crypto backend
        if: startsWith(matrix.features, 'airvpn,')
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}" airvpn::crypto::tests

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        run: cargo audit

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Install pinned Markdown linter
        run: cargo install rumdl --version 0.2.77 --locked
      - run: rumdl check README.md AGENTS.md

  docker:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build container
        run: docker build --tag tunmux:ci .
      - name: Check container CLI
        run: |
          docker run --rm tunmux:ci --version
          docker run --rm tunmux:ci --help
          docker run --rm tunmux:ci status
