[package]
name = "tunmux-gui"
version.workspace = true
edition.workspace = true
description = "Tray and egui front-end for tunmux"
license.workspace = true
publish = false

[dependencies]
tunmux-core = { path = "../tunmux-core" }
tunmux-build-version.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
egui = "0.37"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
rustix = { version = "1.1", features = ["event", "fs", "net", "process", "std"] }
