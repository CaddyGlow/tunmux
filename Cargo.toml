[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/tunmux-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tunmux-build-version = { path = "crates/tunmux-build-version" }

[patch.crates-io]
smoltcp = { git = "https://github.com/CaddyGlow/smoltcp.git", rev = "027d31c3c6c27fa92d0e0221ab707dcc72bd69f1" }
