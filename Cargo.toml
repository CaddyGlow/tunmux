[workspace]
members = ["."]
resolver = "2"

[package]
name = "tunmux"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "tunmux"
path = "src/lib.rs"

[[bin]]
name = "tunmux"
path = "src/main.rs"

[features]
default = ["proxy", "all-providers"]
all-providers = ["proton", "airvpn", "mullvad", "ivpn", "wgconf"]
proton = ["dep:rpassword", "dep:num-bigint", "dep:num-traits", "dep:sha2", "dep:bcrypt", "dep:ed25519-dalek", "dep:curve25519-dalek", "dep:x509-parser"]
airvpn = ["dep:rpassword", "dep:rsa", "dep:aes", "dep:cbc", "dep:scraper", "dep:reqwest_cookie_store", "dep:cookie", "dep:roxmltree", "reqwest/cookies"]
mullvad = ["dep:sha2", "dep:ed25519-dalek", "dep:curve25519-dalek", "dep:reqwest_cookie_store", "reqwest/cookies"]
ivpn = ["dep:rpassword", "dep:sha2", "dep:ed25519-dalek", "dep:curve25519-dalek", "reqwest/cookies"]
wgconf = []
proxy = []
keyring = ["dep:keyring"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Logging
log = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "env-filter"] }
time = { version = "0.3", features = ["macros"] }

# Crypto - SRP
num-bigint = { version = "0.4", features = ["rand"], optional = true }
num-traits = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
bcrypt = { version = "0.16", optional = true }

# Crypto - Keys
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
curve25519-dalek = { version = "4", optional = true }
rand = "0.8"

# Encoding
base64 = "0.23"
bytes = "1"
crossbeam-queue = "0.3"

# Crypto - AirVPN API
rsa = { version = "0.9", features = ["std"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }

# HTML parsing
scraper = { version = "0.27", optional = true }

# Cookie persistence
reqwest_cookie_store = { version = "0.9", optional = true }
cookie = { version = "0.18", optional = true }

# XML parsing
roxmltree = { version = "0.21", optional = true }
x509-parser = { version = "0.18", optional = true }

# Error handling
thiserror = "2"
anyhow = "1"

# Keyring (optional)
keyring = { version = "3", optional = true }

# Userspace WireGuard crypto + virtual TCP/IP stack for local-proxy mode
boringtun = "0.7"
smoltcp = { version = "0.14", default-features = false, features = [
    "socket-tcp",
    "socket-udp",
    "proto-ipv4",
    "proto-ipv6",
    "medium-ip",
    "alloc",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Password input (terminal only)
rpassword = { version = "7", optional = true }

# Linux namespaces
nix = { version = "0.31", features = ["sched", "net", "fs", "signal", "process", "user", "mount"] }

# Daemonization and userspace WireGuard (unix, non-Android)
daemonize = "0.5"
gotatun = { version = "0.10", default-features = false, features = ["device", "tun", "ring"] }

[patch.crates-io]
smoltcp = { path = "third_party/smoltcp" }
